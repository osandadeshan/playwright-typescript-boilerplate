name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.set-cache-key.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache node_modules and browsers
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set cache key output
        id: set-cache-key
        run: echo "cache-key=${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

  test:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Restore node_modules and browsers cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ needs.build.outputs.cache-key }}

      - name: Install Playwright Browsers and dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Generate Allure report
        id: generate-allure
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results -o allure-report
            echo "report-created=true" >> $GITHUB_OUTPUT
          else
            echo "No allure-results found, skipping report generation"
            echo "report-created=false" >> $GITHUB_OUTPUT
          fi

      - name: Add deployed Allure report URL file to artifact
        if: steps.generate-allure.outputs.report-created == 'true'
        run: |
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" > allure-report/ALLURE_REPORT_URL.txt

      - name: Prepare Pages artifact structure
        if: steps.generate-allure.outputs.report-created == 'true'
        run: |
          mkdir -p public
          cp -r allure-report/* public/

      - name: Upload Allure report to Pages artifact
        if: steps.generate-allure.outputs.report-created == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.generate-allure.outputs.report-created == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Allure report link to workflow summary
        if: steps.generate-allure.outputs.report-created == 'true'
        run: |
          echo "### Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
